<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Kissan Saathi — Admin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #15803D; --green-dark: #14532D; --green-light: #ECFDF3; --green-border: #BBF7D0;
    --amber: #B45309; --amber-bg: #FFFBEB; --amber-border: #FDE68A;
    --red: #B91C1C; --red-bg: #FEF2F2; --red-border: #FECACA;
    --blue: #1D4ED8; --blue-bg: #EFF6FF;
    --purple: #7C3AED; --purple-bg: #F5F3FF;
    --border: #E5E7EB; --text: #0F1720; --text-muted: #667085; --text-faint: #98A2B3;
    --bg: #F7F8FA; --white: #FFFFFF;
    --shadow-sm: 0 1px 3px rgba(16,24,40,0.05);
    --shadow-md: 0 4px 12px rgba(16,24,40,0.07), 0 1px 3px rgba(16,24,40,0.05);
    --shadow-lg: 0 12px 32px rgba(16,24,40,0.10);
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Inter', 'Noto Sans Devanagari', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; font-size: 15px; }
  .app { display: flex; height: 100vh; }
  .icon { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; width: 20px; height: 20px; }
  .icon svg { width: 100%; height: 100%; }

  /* ---------- Sidebar ---------- */
  .sidebar { width: 258px; background: var(--white); border-right: 1px solid var(--border); padding: 24px 0; flex-shrink: 0; display: flex; flex-direction: column; }
  .brand { padding: 0 22px 22px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); margin-bottom: 10px; }
  .brand-icon { width: 42px; height: 42px; background: linear-gradient(135deg, var(--green) 0%, #0D9448 100%); border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: var(--shadow-sm); }
  .brand-text h1 { font-size: 17px; margin: 0; font-weight: 800; letter-spacing: -0.3px; }
  .brand-text .sub { font-size: 12px; color: var(--text-muted); font-weight: 500; }
  .logo-todo { font-size: 9.5px; color: var(--amber); font-weight: 700; margin-top: 1px; }
  .nav-section-label { padding: 20px 22px 8px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.7px; color: var(--text-faint); font-weight: 800; }
  .nav-item { margin: 2px 12px; padding: 11px 14px; cursor: pointer; font-size: 14.5px; color: var(--text-muted); border-radius: 10px; font-weight: 600; display: flex; align-items: center; gap: 12px; transition: all 0.15s; }
  .nav-item .icon { width: 19px; height: 19px; color: var(--text-faint); }
  .nav-item.active { color: var(--green-dark); background: var(--green-light); }
  .nav-item.active .icon { color: var(--green); }
  .nav-item:hover:not(.active) { background: #F7F8FA; color: var(--text); }
  .sidebar-footer { margin-top: auto; padding: 18px 22px 0; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }

  /* ---------- Language toggle ---------- */
  .lang-toggle { display: flex; align-items: center; gap: 8px; background: var(--bg); border: 1.5px solid var(--border); border-radius: 10px; padding: 4px; }
  .lang-toggle button { flex: 1; background: transparent; color: var(--text-muted); padding: 7px 8px; font-size: 12.5px; font-weight: 700; box-shadow: none; }
  .lang-toggle button:hover { opacity: 1; transform: none; box-shadow: none; background: rgba(0,0,0,0.03); }
  .lang-toggle button.active { background: var(--white); color: var(--green-dark); box-shadow: var(--shadow-sm); }

  /* ---------- Main ---------- */
  .main { flex: 1; overflow-y: auto; }
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 20px 36px; border-bottom: 1px solid var(--border); background: var(--white); position: sticky; top: 0; z-index: 5; }
  .topbar h2 { margin: 0; font-size: 23px; font-weight: 800; letter-spacing: -0.4px; }
  .topbar .subtitle { color: var(--text-muted); font-size: 13.5px; margin-top: 3px; font-weight: 500; }
  .live-badge { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; color: var(--green-dark); background: var(--green-light); padding: 7px 14px; border-radius: 999px; border: 1px solid var(--green-border); }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: pulse 1.8s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(21,128,61,0.5); } 70% { box-shadow: 0 0 0 7px rgba(21,128,61,0); } 100% { box-shadow: 0 0 0 0 rgba(21,128,61,0); } }
  .content { padding: 30px 36px 50px; }
  .sample-banner { background: var(--amber-bg); border: 1px solid var(--amber-border); color: var(--amber); padding: 13px 17px; border-radius: 12px; font-size: 14px; margin-bottom: 24px; font-weight: 600; display: flex; align-items: center; gap: 10px; }

  /* ---------- Snapshot banner (the "unique" element) ---------- */
  .snapshot-banner { background: linear-gradient(120deg, var(--green-dark) 0%, var(--green) 100%); border-radius: var(--radius); padding: 22px 26px; margin-bottom: 24px; color: white; position: relative; overflow: hidden; box-shadow: var(--shadow-md); }
  .snapshot-banner::before { content: ''; position: absolute; right: -30px; top: -30px; width: 160px; height: 160px; background: radial-gradient(circle, rgba(255,255,255,0.10) 0%, transparent 70%); }
  .snapshot-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; font-weight: 800; opacity: 0.85; margin-bottom: 6px; }
  .snapshot-text { font-size: 16.5px; font-weight: 600; line-height: 1.5; max-width: 720px; }
  .snapshot-season { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; background: rgba(255,255,255,0.15); padding: 4px 11px; border-radius: 999px; margin-top: 12px; }

  /* ---------- KPI cards ---------- */
  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; margin-bottom: 26px; }
  .kpi-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px 24px; box-shadow: var(--shadow-sm); transition: box-shadow 0.15s, transform 0.15s; }
  .kpi-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
  .kpi-card .top-row { display: flex; align-items: center; justify-content: space-between; }
  .kpi-card .icon-box { width: 42px; height: 42px; border-radius: 11px; display: flex; align-items: center; justify-content: center; background: var(--green-light); }
  .kpi-card .icon-box .icon { width: 22px; height: 22px; color: var(--green); }
  .kpi-card.warn .icon-box { background: var(--amber-bg); }
  .kpi-card.warn .icon-box .icon { color: var(--amber); }
  .kpi-card.info .icon-box { background: var(--blue-bg); }
  .kpi-card.info .icon-box .icon { color: var(--blue); }
  .kpi-card.purple .icon-box { background: var(--purple-bg); }
  .kpi-card.purple .icon-box .icon { color: var(--purple); }
  .kpi-card .num { font-size: 34px; font-weight: 800; margin-top: 14px; letter-spacing: -1px; line-height: 1; }
  .kpi-card .label { font-size: 13.5px; color: var(--text-muted); margin-top: 5px; font-weight: 600; }
  .delta { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
  .delta.up { color: var(--green-dark); background: var(--green-light); }
  .delta.down { color: var(--red); background: var(--red-bg); }
  .delta.flat { color: var(--text-muted); background: var(--bg); }

  /* ---------- Charts + activity layout ---------- */
  .charts-row { display: grid; grid-template-columns: 1.5fr 1fr; gap: 18px; margin-bottom: 20px; align-items: stretch; }
  .panel { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow-sm); }
  .panel h3 { margin: 0 0 4px; font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 9px; }
  .panel h3 .icon { width: 19px; height: 19px; color: var(--green); }
  .panel .panel-sub { font-size: 12.5px; color: var(--text-muted); margin-bottom: 16px; font-weight: 500; }
  .chart-wrap { height: 240px; position: relative; }

  /* ---------- Recent Activity feed ---------- */
  .activity-feed { display: flex; flex-direction: column; gap: 2px; max-height: 460px; overflow-y: auto; }
  .activity-item { display: flex; gap: 13px; padding: 13px 4px; border-bottom: 1px solid #F3F4F6; }
  .activity-item:last-child { border-bottom: none; }
  .activity-avatar { width: 38px; height: 38px; border-radius: 10px; background: var(--green-light); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-weight: 800; font-size: 14px; color: var(--green-dark); }
  .activity-item.grievance .activity-avatar { background: var(--red-bg); color: var(--red); }
  .activity-body { flex: 1; min-width: 0; }
  .activity-top { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
  .activity-farmer { font-weight: 700; font-size: 13.5px; }
  .activity-time { font-size: 11.5px; color: var(--text-faint); margin-left: auto; white-space: nowrap; }
  .activity-text { font-size: 13.5px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .activity-crop-tag { font-size: 10.5px; font-weight: 700; background: var(--bg); color: var(--text-muted); padding: 2px 7px; border-radius: 6px; }

  /* ---------- Tables ---------- */
  table { width: 100%; border-collapse: collapse; background: var(--white); border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
  th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); padding: 14px 16px; border-bottom: 1px solid var(--border); background: #FAFBFC; font-weight: 800; white-space: nowrap; }
  td { padding: 15px 16px; border-bottom: 1px solid var(--border); font-size: 14px; vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  tr.clickable { transition: background 0.1s; }
  tr.clickable:hover { background: #FAFBFC; cursor: pointer; }
  .table-scroll { overflow-x: auto; border-radius: var(--radius); box-shadow: var(--shadow-sm); }
  .table-scroll table { box-shadow: none; border-radius: 0; }
  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; }
  .badge.new { background: var(--red-bg); color: var(--red); }
  .badge.in_progress { background: var(--amber-bg); color: var(--amber); }
  .badge.resolved { background: var(--green-light); color: var(--green-dark); }

  /* ---------- Form controls ---------- */
  input, select, textarea { border: 1.5px solid var(--border); border-radius: 10px; padding: 10px 14px; font-size: 14px; font-family: inherit; background: var(--white); }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 4px var(--green-light); }
  button { background: var(--green); color: white; border: none; border-radius: 10px; padding: 10px 18px; font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.15s; }
  button:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: var(--shadow-sm); }
  button.secondary { background: var(--white); color: var(--text); border: 1.5px solid var(--border); }
  .toolbar { display: flex; gap: 12px; margin-bottom: 18px; align-items: center; flex-wrap: wrap; }
  .search-box { position: relative; }
  .search-box input { padding-left: 40px; width: 300px; }
  .search-box .icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--text-faint); width: 16px; height: 16px; }

  /* ---------- Login ---------- */
  .login-screen { display: flex; align-items: center; justify-content: center; height: 100vh; background: radial-gradient(circle at 30% 20%, #F0FDF4 0%, var(--bg) 55%); }
  .login-card { background: white; border: 1px solid var(--border); border-radius: 22px; padding: 40px; width: 400px; box-shadow: var(--shadow-lg); }
  .login-card .login-icon { width: 60px; height: 60px; background: linear-gradient(135deg, var(--green) 0%, #0D9448 100%); border-radius: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto 18px; box-shadow: var(--shadow-md); }
  .login-card h1 { text-align: center; margin: 0 0 3px; font-size: 21px; font-weight: 800; }
  .login-card .subtitle { text-align: center; margin-bottom: 28px; color: var(--text-muted); font-size: 14px; font-weight: 500; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 7px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.4px; }
  .field input { width: 100%; }
  .error-banner { background: var(--red-bg); border: 1px solid #FECACA; color: var(--red); padding: 13px 17px; border-radius: 12px; font-size: 14px; margin-bottom: 18px; font-weight: 600; line-height: 1.5; }
  .error-text { color: var(--red); font-size: 13px; margin-top: 9px; background: var(--red-bg); padding: 10px 13px; border-radius: 9px; font-weight: 500; }

  .empty-state { text-align: center; padding: 70px 20px; color: var(--text-faint); font-size: 14.5px; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,32,0.55); display: flex; align-items: center; justify-content: center; z-index: 10; backdrop-filter: blur(3px); }
  .modal { background: white; border-radius: 20px; padding: 28px; width: 480px; max-height: 82vh; overflow-y: auto; box-shadow: var(--shadow-lg); }
  .modal h3 { margin-top: 0; font-size: 18px; font-weight: 800; }
  .modal textarea { width: 100%; min-height: 82px; margin-top: 7px; resize: vertical; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
  .profile-summary-box { background: var(--green-light); border: 1px solid var(--green-border); border-radius: 12px; padding: 13px 15px; margin-bottom: 16px; font-size: 13.5px; color: var(--green-dark); font-weight: 600; display: flex; gap: 10px; align-items: flex-start; }
  .profile-summary-box .icon { color: var(--green-dark); margin-top: 1px; }
  .history-item { border: 1px solid var(--border); border-radius: 14px; padding: 15px; margin-bottom: 11px; }
  .history-item .meta { font-size: 11.5px; color: var(--text-faint); margin-bottom: 7px; display: flex; align-items: center; gap: 7px; font-weight: 600; }
  .history-item .q { font-weight: 700; margin-bottom: 5px; font-size: 14px; }
  .history-item .a { color: var(--text-muted); font-size: 13.5px; line-height: 1.55; }

  /* ================= upgrade: shared ================= */
  .btn-sm { padding: 6px 12px; font-size: 13px; border-radius: 9px; }
  .section-title { font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-faint); margin: 26px 0 12px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .topbar-right { display: flex; align-items: center; gap: 12px; }
  .date-pill { font-size: 13px; font-weight: 600; color: var(--text-muted); background: var(--white); border: 1px solid var(--border); padding: 6px 12px; border-radius: 999px; }
  .topbar-right button .icon svg { width: 15px; height: 15px; }
  .nav-badge { margin-left: auto; color: #fff; border-radius: 999px; font-size: 11px; font-weight: 800; padding: 1px 8px; min-width: 20px; text-align: center; }
  .nav-badge.red { background: #DC2626; } .nav-badge.amber { background: #D97706; } .nav-badge.blue { background: #2563EB; }
  .conn { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-muted); font-weight: 600; margin-bottom: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conn-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .conn-dot.ok { background: #16A34A; box-shadow: 0 0 0 3px rgba(22,163,74,0.18); } .conn-dot.bad { background: #DC2626; } .conn-dot.wait { background: #F59E0B; }

  .toasts { position: fixed; right: 24px; bottom: 24px; display: flex; flex-direction: column; gap: 10px; z-index: 2000; }
  .toast { background: #0F1720; color: #fff; padding: 12px 18px; border-radius: 12px; font-size: 14px; font-weight: 600; box-shadow: var(--shadow-lg); animation: toast-in 0.2s ease-out; }
  .toast.error { background: #B91C1C; }
  @keyframes toast-in { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  button.chip { border: 1px solid var(--border); background: var(--white); color: var(--text-muted); padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 700; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; box-shadow: none; }
  button.chip .n { background: #F1F3F5; border-radius: 999px; padding: 1px 8px; font-size: 12px; color: var(--text-muted); }
  button.chip:hover { border-color: var(--green-border); background: var(--green-light); }
  button.chip.active { background: var(--green-light); border-color: var(--green-border); color: var(--green-dark); }
  button.chip.active .n { background: var(--green); color: #fff; }

  .avatar { width: 34px; height: 34px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; color: #fff; flex: none; }
  .person { display: flex; align-items: center; gap: 11px; }
  .person .who { font-weight: 700; line-height: 1.2; } .person .id { font-size: 12px; color: var(--text-faint); font-weight: 500; }

  .kpi-card .sub { font-size: 12.5px; color: var(--text-muted); margin-top: 6px; font-weight: 600; }
  .kpi-card.clickable { cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; }
  .kpi-card.clickable:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }

  .two-col { display: grid; grid-template-columns: 1fr 1.35fr; gap: 20px; }
  @media (max-width: 1100px) { .two-col { grid-template-columns: 1fr; } }

  .attention-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 16px; border-radius: 12px; border: 1px solid var(--border); border-left-width: 4px; margin-bottom: 10px; cursor: pointer; background: var(--white); transition: box-shadow 0.15s; }
  .attention-item:hover { box-shadow: var(--shadow-md); }
  .attention-item.red { border-left-color: #DC2626; } .attention-item.amber { border-left-color: #D97706; } .attention-item.blue { border-left-color: #2563EB; }
  .att-label { font-weight: 700; } .att-hint { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }
  .att-count { font-size: 22px; font-weight: 800; }
  .attention-item.red .att-count { color: #B91C1C; } .attention-item.amber .att-count { color: #B45309; } .attention-item.blue .att-count { color: #1D4ED8; }

  .timeline { display: flex; flex-direction: column; }
  .tl-item { display: flex; gap: 12px; padding: 11px 0; border-bottom: 1px solid #F1F3F5; align-items: flex-start; }
  .tl-item:last-child { border-bottom: none; }
  .tl-dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; flex: none; }
  .tl-dot.green { background: #16A34A; } .tl-dot.blue { background: #3B82F6; } .tl-dot.amber { background: #F59E0B; } .tl-dot.red { background: #DC2626; }
  .tl-body { flex: 1; min-width: 0; } .tl-top span { color: var(--text-muted); }
  .tl-detail { font-size: 13px; color: var(--text-muted); margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tl-time { font-size: 12px; color: var(--text-faint); white-space: nowrap; font-weight: 600; }

  .mandi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
  .mandi-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow-sm); }
  .mandi-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 15px; } .mandi-head .icon svg { width: 17px; height: 17px; color: var(--green); }
  .capacity-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 13px; color: var(--text-muted); font-weight: 600; }
  .capacity-row input { width: 80px; padding: 6px 8px; }
  .window-row { padding: 10px 0; border-top: 1px solid #F1F3F5; }
  .window-top { display: flex; justify-content: space-between; font-size: 13.5px; margin-bottom: 6px; font-weight: 600; }
  .bar-track { height: 9px; background: #F1F3F5; border-radius: 999px; overflow: hidden; } .bar-fill { height: 100%; border-radius: 999px; transition: width 0.4s; }
  .window-sub { font-size: 12.5px; color: var(--text-muted); margin-top: 6px; }

  .empty-block { text-align: center; padding: 36px 20px; }
  .empty-icon { width: 54px; height: 54px; border-radius: 50%; background: var(--green-light); color: var(--green); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 12px; }
  .empty-icon svg { width: 26px; height: 26px; }
  .empty-title { font-weight: 700; font-size: 15px; } .empty-hint { color: var(--text-muted); font-size: 13.5px; margin-top: 4px; max-width: 420px; margin-left: auto; margin-right: auto; line-height: 1.5; }

  .skeleton { height: 14px; border-radius: 6px; background: linear-gradient(90deg, #F1F3F5 25%, #E5E7EB 37%, #F1F3F5 63%); background-size: 400% 100%; animation: shimmer 1.4s ease infinite; }
  @keyframes shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }

function useT(lang) {
  return useCallback((key) => TRANSLATIONS[lang][key] ?? TRANSLATIONS.en[key] ?? key, [lang]);
}

function LangToggle({ lang, setLang }) {
  return (
    <div className="lang-toggle">
      <button className={lang === 'en' ? 'active' : 'secondary'} onClick={() => setLang('en')}>English</button>
      <button className={lang === 'hi' ? 'active' : 'secondary'} onClick={() => setLang('hi')}>हिन्दी</button>
    </div>
  );
}

function timeAgo(seconds) {
  if (seconds < 5) return 'just now';
  if (seconds < 60) return `${seconds}s ago`;
  if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
  return `${Math.floor(seconds / 3600)}h ago`;
}

function LiveBadge({ lastRefreshed, t }) {
  const [, forceTick] = useState(0);
  useEffect(() => { const timer = setInterval(() => forceTick(n => n + 1), 1000); return () => clearInterval(timer); }, []);
  if (!lastRefreshed) return null;
  const secondsAgo = Math.floor((Date.now() - lastRefreshed) / 1000);
  return (
    <div className="live-badge">
      <div className="live-dot"></div>
      {t('live')} · {t('updated')} {timeAgo(secondsAgo)}
    </div>
  );
}


function LoginScreen({ onLogin, lang, setLang, t }) {
  const [apiUrl, setApiUrl] = useState('http://localhost:8000');
  const [token, setToken] = useState('');
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    setError(''); setLoading(true);
    try {
      const res = await fetch(`${apiUrl.replace(/\/$/, '')}/admin/overview`, { headers: { 'X-Admin-Token': token } });
      if (res.status === 401) { setError('Invalid admin token.'); setLoading(false); return; }
      if (!res.ok) { setError(`Server responded with ${res.status}. Check the backend URL.`); setLoading(false); return; }
      onLogin(apiUrl.replace(/\/$/, ''), token);
    } catch (err) {
      setError('Could not reach that URL. Is the backend running, and is this device on the same network?');
      setLoading(false);
    }
  };

  return (
    <div className="login-screen">
      <div className="login-card">
        <div className="login-icon" style={{ fontSize: 30 }}>🌾</div>
        <h1>{t('appName')}</h1>
        <div className="subtitle">{t('appSubtitle')}</div>
        <div style={{ marginBottom: 20 }}><LangToggle lang={lang} setLang={setLang} /></div>
        <form onSubmit={submit}>
          <div className="field">
            <label>{t('backendUrl')}</label>
            <input value={apiUrl} onChange={e => setApiUrl(e.target.value)} placeholder="http://192.168.x.x:8000" />
          </div>
          <div className="field">
            <label>{t('adminToken')}</label>
            <input type="password" value={token} onChange={e => setToken(e.target.value)} placeholder="From ADMIN_TOKEN in backend .env" />
          </div>
          {error && <div className="error-text">{error}</div>}
          <button type="submit" style={{ width: '100%', marginTop: 8, padding: '12px' }} disabled={loading}>
            {loading ? t('connecting') : t('signIn')}
          </button>
        </form>
      </div>
    </div>
  );
}


function useAdminFetch(apiUrl, token) {
  return useCallback(async (path, options = {}) => {
    const res = await fetch(`${apiUrl}${path}`, {
      ...options,
      headers: { 'X-Admin-Token': token, 'Content-Type': 'application/json', ...(options.headers || {}) },
    });
    if (!res.ok) throw new Error(`${res.status}`);
    return res.json();
  }, [apiUrl, token]);
}

function errorCodeOf(e) {
  return e && /^\d+$/.test(String(e.message)) ? String(e.message) : 'network';
}

function ErrorNotice({ code, t }) {
  if (!code) return null;
  const text = code === '404' ? t('errNotFound') : code === '401' ? t('errAuth')
    : code === 'network' ? t('errNetwork') : t('errServer').replace('{n}', code);
  return <div className="error-banner">{text}</div>;
}

function LineChart({ trends }) {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);
  useEffect(() => {
    if (!canvasRef.current || !trends) return;
    const labels = trends.map(t => new Date(t.date).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }));
    if (chartRef.current) {
      chartRef.current.data.labels = labels;
      chartRef.current.data.datasets[0].data = trends.map(t => t.total);
      chartRef.current.data.datasets[1].data = trends.map(t => t.grievances);
      chartRef.current.update('none');
      return;
    }
    chartRef.current = new Chart(canvasRef.current, {
      type: 'line',

// ================= helpers =================
let LOCALE = 'en-IN';
const TZ_SUFFIX = /(Z|[+-]\d\d:?\d\d)$/;
// The server stores UTC without a zone label; without this a browser shows every time 5.5 hours early in India.
const parseTs = (value) => {
  if (!value) return null;
  const s = String(value);
  const d = new Date(TZ_SUFFIX.test(s) ? s : `${s}Z`);
  return isNaN(d) ? null : d;
};
const fmtDateTime = (value) => {
  const d = parseTs(value);
  return d ? d.toLocaleString(LOCALE, { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }) : '—';
};
const fmtDay = (isoDay) => {
  if (!isoDay) return '—';
  const d = new Date(`${isoDay}T00:00:00`);
  return isNaN(d) ? String(isoDay) : d.toLocaleDateString(LOCALE, { day: 'numeric', month: 'short', year: 'numeric' });
};
const money = (n) => (n == null ? '—' : `₹${Number(n).toLocaleString('en-IN', { maximumFractionDigits: 0 })}`);
const todayIso = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const shiftDay = (iso, days) => { const d = new Date(`${iso}T00:00:00`); d.setDate(d.getDate() + days); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const initials = (name, id) => {
  const source = (name || '').trim();
  if (!source) return String(id || '?').slice(-2);
  const parts = source.split(/\s+/);
  return (parts[0][0] + (parts.length > 1 ? parts[parts.length - 1][0] : '')).toUpperCase();
};
const AVATAR_COLORS = ['#15803D', '#1D4ED8', '#B45309', '#7C3AED', '#0F766E', '#BE185D', '#4D7C0F'];
const avatarColor = (seed) => { let h = 0; for (const c of String(seed)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return AVATAR_COLORS[h % AVATAR_COLORS.length]; };
const prettyCode = (code) => (code ? code.replace(/_/g, ' ').replace(/^./, (c) => c.toUpperCase()) : '');
const matches = (needle, ...values) => { const n = (needle || '').trim().toLowerCase(); return !n || values.some((v) => String(v ?? '').toLowerCase().includes(n)); };

function toCsv(columns, rows) {
  const esc = (v) => { const s = v == null ? '' : String(v); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  return [columns.map((c) => esc(c.label)).join(','), ...rows.map((r) => columns.map((c) => esc(c.value(r))).join(','))].join('\n');
}
function downloadCsv(filename, columns, rows) {
  const blob = new Blob(['\ufeff' + toCsv(columns, rows)], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => { if (URL.revokeObjectURL) URL.revokeObjectURL(url); }, 1000);
}

function useList(apiFetch, path, ms = 15000) {
  const [data, setData] = useState(null);
  const [error, setError] = useState('');
  const [lastRefreshed, setLastRefreshed] = useState(null);
  const load = useCallback(() => apiFetch(path).then((d) => { setData(d); setError(''); setLastRefreshed(Date.now()); }).catch((e) => setError(errorCodeOf(e))), [apiFetch, path]);
  useEffect(() => {
    load();
    const timer = setInterval(load, ms);
    window.addEventListener('dash-refresh', load);
    return () => { clearInterval(timer); window.removeEventListener('dash-refresh', load); };
  }, [load, ms]);
  return { data, error, lastRefreshed, reload: load, loaded: data !== null };
}

const ToastContext = React.createContext(() => {});

function ToastProvider({ children }) {
  const [items, setItems] = useState([]);
  const push = useCallback((message, kind = 'success') => {
    const id = Math.random();
    setItems((x) => [...x, { id, message, kind }]);
    setTimeout(() => setItems((x) => x.filter((i) => i.id !== id)), 3600);
  }, []);
  return (
    <ToastContext.Provider value={push}>
      {children}
      <div className="toasts">{items.map((i) => <div key={i.id} className={`toast ${i.kind}`}>{i.message}</div>)}</div>

  );
}

function relTime(ts) {
  const d = parseTs(ts);
  if (!d) return '';
  const s = Math.max(0, Math.floor((Date.now() - d.getTime()) / 1000));
  if (s < 60) return 'just now';
  if (s < 3600) return `${Math.floor(s / 60)}m ago`;
  if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
  return `${Math.floor(s / 86400)}d ago`;
}

function describeActivity(t, item, codes) {
  const d = item.data || {};
  switch (item.kind) {
    case 'registered': { let crops = ''; try { crops = JSON.parse(d.crops || '[]').join(', '); } catch (e) { crops = ''; } return { title: t('actRegistered'), detail: crops, tone: 'blue' }; }
    case 'chat': return { title: t('actChat'), detail: d.text, tone: 'green' };
    case 'complaint': return { title: t('actComplaint'), detail: d.text, tone: 'amber' };
    case 'slot_booked': return { title: t('actSlotBooked'), detail: [d.mandi, fmtDay(d.date), d.window].filter(Boolean).join(' · '), tone: 'blue' };
    case 'slot_checked_in': return { title: t('actCheckedIn'), detail: d.mandi, tone: 'blue' };
    case 'slot_completed': return { title: t('actCompleted'), detail: [d.mandi, d.crop].filter(Boolean).join(' · '), tone: 'green' };
    case 'payment': return {
      title: t(`actPay_${d.status}`),
      detail: [d.crop, d.amount != null ? money(d.amount) : null, d.reason ? (codes[d.reason] || prettyCode(d.reason)) : null].filter(Boolean).join(' · '),
      tone: d.status === 'paid' ? 'green' : d.status === 'failed' ? 'red' : 'amber',
    };
    default: return { title: item.kind, detail: '', tone: 'blue' };
  }
}

// ================= farmers =================
function FarmerModal({ id, apiFetch, t, onClose, onMessage }) {
  const { codes } = useData();
  const toast = useToast();
  const [detail, setDetail] = useState(null);
  const [error, setError] = useState('');
  const [tab, setTab] = useState('chats');
  const [busy, setBusy] = useState(false);

  const load = useCallback((alive = { current: true }) => apiFetch(`/admin/farmers/${id}`)
    .then((d) => { if (alive.current) { setDetail(d); setError(''); } })
    .catch((e) => { if (alive.current) setError(errorCodeOf(e)); }), [apiFetch, id]);
  useEffect(() => { const alive = { current: true }; setDetail(null); setError(''); load(alive); return () => { alive.current = false; }; }, [load]);

  const buildMemory = async () => {
    setBusy(true);
    try { await apiFetch(`/farmer/${id}/consolidate`, { method: 'POST' }); toast(t('memoryBuilt')); await load(); }
    catch (e) { toast(t('memoryFailed'), 'error'); }
    finally { setBusy(false); }
  };

  const body = () => {
    if (error === '404') return <EmptyBlock icon={Icons.users} title={t('farmerGone')} />;
    if (error) return <ErrorNotice code={error} t={t} />;
    if (!detail) return <div className="skeleton" style={{ height: 160 }} />;
    const tabs = [
      { id: 'chats', label: t('tabChats'), n: detail.interactions.length },
      { id: 'slots', label: t('tabSlots'), n: detail.slots.length },
      { id: 'payments', label: t('tabPayments'), n: detail.payments.length },
      { id: 'complaints', label: t('tabComplaints'), n: detail.complaints.length },
      { id: 'memory', label: t('tabMemory') },
    ];
    return (
      <div>
        <div className="mini-stats">
          <div><strong>{detail.interactions.length}</strong><span>{t('colMessages')}</span></div>
          <div><strong>{detail.slots.length}</strong><span>{t('colSlotsCount')}</span></div>
          <div><strong>{detail.payments.length}</strong><span>{t('colPaymentsCount')}</span></div>
          <div><strong>{detail.complaints.length}</strong><span>{t('colGrievances')}</span></div>
        </div>
        <div className="tabs-inline">{tabs.map((x) => <button key={x.id} className={`tab-btn ${tab === x.id ? 'active' : ''}`} onClick={() => setTab(x.id)}>{x.label}{x.n != null ? ` (${x.n})` : ''}</button>)}</div>
        <div className="modal-scroll">
          {tab === 'chats' && (detail.interactions.length === 0
            ? <EmptyBlock icon={Icons.chat} title={t('noChatsYet')} hint={t('noChatsYetHint')} />
            : detail.interactions.map((h) => (
              <div className="history-item" key={h.id}>
                <div className="meta">{fmtDateTime(h.ts)} {h.crop && `· ${h.crop}`}{h.is_grievance ? <span className="badge new" style={{ marginLeft: 8 }}>{t('grievanceBadge')}</span> : null}</div>
                <div className="q">{h.query_text}</div>
                <div className="a">{h.response_text}</div>
              </div>
            )))}
          {tab === 'slots' && (detail.slots.length === 0
            ? <EmptyBlock icon={Icons.calendar} title={t('noSlotsFarmer')} />
            : <table><thead><tr><th>{t('colToken')}</th><th>{t('colMandi')}</th><th>{t('colDate')}</th><th>{t('colWindow')}</th><th>{t('colStatus')}</th></tr></thead>
              <tbody>{detail.slots.map((s) => <tr key={s.id}><td><strong>{s.token}</strong></td><td>{s.mandi_name || s.mandi_id}</td><td>{fmtDay(s.slot_date)}</td><td>{s.window}</td><td><span className={`badge ${SLOT_BADGE[s.status]}`}>{t(`slot_${s.status}`)}</span></td></tr>)}</tbody></table>)}
          {tab === 'payments' && (detail.payments.length === 0
            ? <EmptyBlock icon={Icons.rupee} title={t('noPaymentsFarmer')} />
            : detail.payments.map((p) => (
              <div className="history-item" key={p.id}>
                <div className="meta"><span className={`badge ${PAY_BADGE[p.status]}`}>{t(`pay_${p.status}`)}</span> {p.crop || ''} {p.quantity_qtl != null ? `· ${p.quantity_qtl} q` : ''} · {money(p.amount)} · {fmtDay(p.sold_on)}</div>
                {p.failure_code && <div className="q">{codes[p.failure_code] || prettyCode(p.failure_code)}</div>}
                {p.timeline.map((e, i) => <div className="a" key={i}>{fmtDateTime(e.ts)} — {t(`pay_${e.status}`)}{e.note ? ` (${e.note})` : ''}</div>)}
              </div>
            )))}
          {tab === 'complaints' && (detail.complaints.length === 0
            ? <EmptyBlock icon={Icons.alert} title={t('noComplaintsFarmer')} />
            : detail.complaints.map((c) => (
              <div className="history-item" key={c.id}>
                <div className="meta">#{c.id} · {fmtDateTime(c.ts)} <span className={`badge ${c.grievance_status}`} style={{ marginLeft: 8 }}>{t(`status_${c.grievance_status}`)}</span></div>
                <div className="q clamp">{c.query_text}</div>
                {c.grievance_note && <div className="a">{t('officerNote')}: {c.grievance_note}</div>}
              </div>
            )))}
          {tab === 'memory' && (
            <div>
              <div className="profile-summary-box"><Icon path={Icons.brain} /><div>{detail.profile_summary || t('noProfileYet')}</div></div>
              <button onClick={buildMemory} disabled={busy}>{busy ? t('building') : t('buildMemory')}</button>
              <div className="hint-text">{t('memoryHint')}</div>
            </div>
          )}
        </div>
      </div>
    );
  };

  const locationChip = detail && detail.location;
  return (
    <Modal wide onClose={onClose} actions={<><button className="secondary" onClick={onClose}>{t('close')}</button></>}>
      <div className="farmer-head">
        <Avatar name={detail && detail.name} id={id} size={54} />
        <div style={{ flex: 1 }}>
          <h3 style={{ margin: 0 }}>{detail && detail.name ? `${detail.name} · ${id}` : id}</h3>
          <div className="pills">
            {detail && !detail.name && <span className="pill">{t('notRegistered')}</span>}
            {locationChip && <span className="pill">📍 {locationChip}</span>}
            {detail && detail.language && <span className="pill">🗣 {detail.language === 'hi' ? 'हिन्दी' : detail.language.toUpperCase()}</span>}
            {detail && detail.registered_at && <span className="pill">{t('registeredOn')} {fmtDateTime(detail.registered_at)}</span>}
          </div>
        </div>
        <button className="secondary" onClick={() => onMessage(id)}>{t('sendMessage')}</button>
      </div>
      {body()}
    </Modal>
  );
}

function FarmersTab({ apiFetch, t, initialFilter, onMessage }) {
  const [search, setSearch] = useState('');
  const [debounced, setDebounced] = useState('');

      <div className="table-scroll">

          <tbody>
            {!list.loaded && !list.error && <SkeletonRows cols={10} />}
            {list.loaded && shown.length === 0 && !list.error && <tr><td colSpan="10"><EmptyBlock icon={Icons.users} title={t('noFarmers')} hint={t('noFarmersHint')} /></td></tr>}
            {shown.map((f) => (
              <tr key={f.farmer_id} className="clickable" onClick={() => setOpenId(f.farmer_id)}>
                <td><Person name={f.name} id={f.farmer_id} /></td>
                <td>{f.location || '—'}</td>
                <td>{f.language ? (f.language === 'hi' ? 'हिन्दी' : f.language.toUpperCase()) : '—'}</td>

}

// ================= grievances =================
function GrievancesTab({ apiFetch, t, initialFilter }) {
  const toast = useToast();
  const [filter, setFilter] = useState(initialFilter || 'all');
  const [search, setSearch] = useState('');
  const [editing, setEditing] = useState(null);
  const [viewing, setViewing] = useState(null);
  const [statusDraft, setStatusDraft] = useState('in_progress');
  const [noteDraft, setNoteDraft] = useState('');
  const [saving, setSaving] = useState(false);
  const list = useList(apiFetch, '/admin/grievances', 15000);
  const rows = list.data || [];
  const searched = rows.filter((g) => matches(search, g.farmer_id, g.farmer_name, g.query_text, g.crop));
  const n = (s) => searched.filter((g) => g.grievance_status === s).length;
  const shown = searched.filter((g) => filter === 'all' || (filter === 'open' ? g.grievance_status !== 'resolved' : g.grievance_status === filter));

  const openEdit = (g) => { setEditing(g); setStatusDraft(g.grievance_status === 'new' ? 'in_progress' : g.grievance_status); setNoteDraft(g.grievance_note || ''); };
  const save = async () => {
    setSaving(true);
    try {
      await apiFetch(`/admin/grievances/${editing.id}`, { method: 'PATCH', body: JSON.stringify({ status: statusDraft, note: noteDraft || null }) });
      toast(t('complaintUpdated')); setEditing(null); list.reload();
    } catch (e) { toast(t('actionFailed'), 'error'); } finally { setSaving(false); }
  };
  const csvColumns = [
    { label: 'ID', value: (g) => g.id }, { label: 'Farmer ID', value: (g) => g.farmer_id }, { label: 'Name', value: (g) => g.farmer_name },
    { label: 'Crop', value: (g) => g.crop }, { label: 'Status', value: (g) => g.grievance_status }, { label: 'Note', value: (g) => g.grievance_note },
    { label: 'Reported', value: (g) => g.ts }, { label: 'Complaint', value: (g) => g.query_text },
  ];

  return (
    <div>
      <div className="toolbar">
        <SearchBox value={search} onChange={setSearch} placeholder={t('searchGrievances')} />
        <div style={{ marginLeft: 'auto', display: 'flex', gap: 10, alignItems: 'center' }}>
          <ExportButton filename="complaints.csv" columns={csvColumns} rows={shown} t={t} />
          {!list.error && <LiveBadge lastRefreshed={list.lastRefreshed} t={t} />}
        </div>
      </div>
      <Chips value={filter} onChange={setFilter} options={[
        { id: 'all', label: t('chipAll'), count: searched.length }, { id: 'open', label: t('chipOpen'), count: n('new') + n('in_progress') },
        { id: 'new', label: t('status_new'), count: n('new') }, { id: 'in_progress', label: t('status_in_progress'), count: n('in_progress') },
        { id: 'resolved', label: t('status_resolved'), count: n('resolved') },
      ]} />
      <ErrorNotice code={list.error} t={t} />
      <div className="table-scroll">
        <table>
          <thead><tr><th>{t('colFarmerId')}</th><th>{t('colComplaint')}</th><th>{t('colCrop')}</th><th>{t('colPayment')}</th><th>{t('colReported')}</th><th>{t('colStatus')}</th><th></th></tr></thead>
          <tbody>
            {!list.loaded && !list.error && <SkeletonRows cols={7} />}
            {list.loaded && shown.length === 0 && !list.error && <tr><td colSpan="7"><EmptyBlock icon={Icons.checkCircle} title={t('noGrievances')} hint={t('noGrievancesHint')} /></td></tr>}
            {shown.map((g) => (
              <tr key={g.id}>
                <td><Person name={g.farmer_name} id={g.farmer_id} /></td>
                <td style={{ maxWidth: 320 }}>
                  <div className="clamp">{(g.query_text || '').replace(/^Subject:\s*/i, '')}</div>
                  <a className="link" onClick={() => setViewing(g)}>{t('viewFull')}</a>
                  {g.grievance_note && <div className="note-line">{t('officerNote')}: {g.grievance_note}</div>}
                </td>
                <td>{g.crop || '—'}</td>
                <td>{g.payment ? <div>{money(g.payment.amount)}<div><span className={`badge ${PAY_BADGE[g.payment.status]}`}>{t(`pay_${g.payment.status}`)}</span></div></div> : '—'}</td>
                <td style={{ whiteSpace: 'nowrap' }}>{fmtDateTime(g.ts)}</td>
                <td><span className={`badge ${g.grievance_status}`}>{t(`status_${g.grievance_status}`)}</span></td>
                <td><button className="secondary btn-sm" onClick={() => openEdit(g)}>{t('update')}</button></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {viewing && (
        <Modal wide title={`${t('complaint')} #${viewing.id}`} onClose={() => setViewing(null)} actions={<button className="secondary" onClick={() => setViewing(null)}>{t('close')}</button>}>
          <Person name={viewing.farmer_name} id={viewing.farmer_id} />
          <pre className="complaint-text">{viewing.query_text}</pre>
        </Modal>
      )}
      {editing && (
        <Modal title={`${t('updateComplaint')} #${editing.id}`} onClose={() => setEditing(null)} actions={<>
          <button className="secondary" onClick={() => setEditing(null)}>{t('cancel')}</button>
          <button onClick={save} disabled={saving}>{t('save')}</button></>}>
          <Person name={editing.farmer_name} id={editing.farmer_id} />
          <div className="field" style={{ marginTop: 14 }}><label>{t('statusLabel')}</label>
            <select value={statusDraft} onChange={(e) => setStatusDraft(e.target.value)} style={{ width: '100%' }}>
              {['new', 'in_progress', 'resolved'].map((s) => <option key={s} value={s}>{t(`status_${s}`)}</option>)}
            </select></div>
          <div className="field"><label>{t('noteLabel')}</label>
            <textarea value={noteDraft} onChange={(e) => setNoteDraft(e.target.value)} placeholder={t('notePlaceholder')} /></div>
          <div className="qr-row">{['qr1', 'qr2', 'qr3'].map((k) => <button key={k} className="chip" onClick={() => setNoteDraft(t(k))}>{t(k)}</button>)}</div>
          <div className="hint-text">{t('complaintNotifyNote')}</div>
        </Modal>
      )}
    </div>
  );
}

  const move = async (slot, next, extra = {}, message) => {
    try {
      await apiFetch(`/admin/slots/${slot.id}`, { method: 'PATCH', body: JSON.stringify({ status: next, ...extra }) });

    { label: 'Crop', value: (s) => s.crop }, { label: 'Quantity (q)', value: (s) => s.quantity_qtl }, { label: 'Mandi', value: (s) => s.mandi_name },

      </div>
      <Chips value={status} onChange={setStatus} options={[
        { id: 'all', label: t('chipAll'), count: base.length }, { id: 'active', label: t('chipInQueue'), count: n((s) => ['booked', 'checked_in'].includes(s.status)) },
        { id: 'completed', label: t('slot_completed'), count: n((s) => s.status === 'completed') }, { id: 'no_show', label: t('slot_no_show'), count: n((s) => s.status === 'no_show') },
        { id: 'cancelled', label: t('slot_cancelled'), count: n((s) => s.status === 'cancelled') },

      <div className="table-scroll">
        <table>
          <thead><tr><th>{t('colToken')}</th><th>{t('colFarmer')}</th><th>{t('colCrop')}</th><th>{t('colMandi')}</th><th>{t('colDate')}</th><th>{t('colWindow')}</th><th>{t('colQueue')}</th><th>{t('colStatus')}</th><th>{t('colActions')}</th></tr></thead>
          <tbody>
            {!list.loaded && !list.error && <SkeletonRows cols={9} />}
            {list.loaded && shown.length === 0 && !list.error && <tr><td colSpan="9"><EmptyBlock icon={Icons.calendar} title={t('noSlots')} hint={t('noSlotsHint')} /></td></tr>}
            {shown.map((s) => (
              <tr key={s.id}>
                <td style={{ fontWeight: 800 }}>{s.token}</td>
                <td><Person name={s.farmer_name} id={s.farmer_id} /></td>
                <td>{s.crop || '—'}{s.quantity_qtl != null ? ` · ${s.quantity_qtl} q` : ''}</td>
                <td>{s.mandi_name || s.mandi_id}</td>
                <td style={{ whiteSpace: 'nowrap' }}>{fmtDay(s.slot_date)}</td>
                <td style={{ whiteSpace: 'nowrap' }}>{s.window}</td>
                <td style={{ whiteSpace: 'nowrap' }}>{queueText(s)}</td>
                <td><span className={`badge ${SLOT_BADGE[s.status]}`}>{t(`slot_${s.status}`)}</span></td>
                <td style={{ whiteSpace: 'nowrap' }}>
                  {s.status === 'booked' && <>
                    <button className="btn-sm" onClick={() => move(s, 'checked_in', {}, t('toastCheckedIn'))}>{t('actCheckIn')}</button>{' '}
                    <button className="secondary btn-sm" onClick={() => move(s, 'no_show', {}, t('toastNoShow'))}>{t('actNoShow')}</button>{' '}
                    <button className="secondary btn-sm" onClick={() => move(s, 'cancelled', {}, t('toastCancelled'))}>{t('actCancel')}</button></>}
                  {s.status === 'checked_in' && <>
                    <button className="btn-sm" onClick={() => { setCompleting(s); setAmount(''); }}>{t('actComplete')}</button>{' '}
                    <button className="secondary btn-sm" onClick={() => move(s, 'cancelled', {}, t('toastCancelled'))}>{t('actCancel')}</button></>}
                  {!['booked', 'checked_in'].includes(s.status) && '—'}
                </td>
              </tr>
            ))}
          </tbody>
        </table>

      {completing && (
        <Modal title={t('completeTitle')} onClose={() => setCompleting(null)} actions={<>
          <button className="secondary" onClick={() => setCompleting(null)}>{t('cancel')}</button>
          <button onClick={() => move(completing, 'completed', amount ? { amount: Number(amount) } : {}, t('toastCompleted'))}>{t('actComplete')}</button></>}>
          <Person name={completing.farmer_name} id={completing.farmer_id} sub={`${completing.token} · ${completing.crop || ''}`} />
          <div className="field" style={{ marginTop: 14 }}><label>{t('amountLabel')}</label><input type="number" min="0" value={amount} onChange={(e) => setAmount(e.target.value)} placeholder={t('amountHint')} /></div>
          <div className="hint-text">{t('completeNote')}</div>
        </Modal>
      )}
    </div>
  );
}

// ================= payments =================
function PaymentsTab({ apiFetch, t, initialFilter }) {
  const toast = useToast();
  const { codes, codeList, farmers } = useData();
  const [filter, setFilter] = useState(initialFilter || 'all');
  const [search, setSearch] = useState('');
  const [creating, setCreating] = useState(false);
  const [editing, setEditing] = useState(null);
  const [viewing, setViewing] = useState(null);
  const blank = { farmer_id: '', crop: '', quantity_qtl: '', amount: '', sold_on: todayIso(), note: '' };
  const [form, setForm] = useState(blank);
  const [edit, setEdit] = useState({ status: 'processing', failure_code: '', note: '' });
  const list = useList(apiFetch, '/admin/payments', 15000);
  const rows = list.data || [];
  const overdue = (p) => ['pending', 'processing'].includes(p.status) && p.days_waiting >= 7;
  const base = rows.filter((p) => matches(search, p.farmer_id, p.farmer_name, p.crop));
  const n = (fn) => base.filter(fn).length;
  const sum = (fn) => rows.filter(fn).reduce((acc, p) => acc + (p.amount || 0), 0);
  const shown = base.filter((p) => filter === 'all' || (filter === 'open' ? ['pending', 'processing'].includes(p.status) : filter === 'overdue' ? overdue(p) : p.status === filter));

  const patch = async (p, body, message) => {
    try { await apiFetch(`/admin/payments/${p.id}`, { method: 'PATCH', body: JSON.stringify(body) }); toast(message); setEditing(null); list.reload(); }
    catch (e) { toast(t('actionFailed'), 'error'); }
  };
  const create = async () => {
    try {
      await apiFetch('/admin/payments', { method: 'POST', body: JSON.stringify({
        farmer_id: form.farmer_id.trim(), crop: form.crop || null, quantity_qtl: form.quantity_qtl ? Number(form.quantity_qtl) : null,
        amount: form.amount ? Number(form.amount) : null, sold_on: form.sold_on || null, note: form.note || null }) });
      toast(t('toastPaymentRecorded')); setCreating(false); setForm(blank); list.reload();
    } catch (e) { toast(t('actionFailed'), 'error'); }
  };
  const openEdit = (p) => { setEditing(p); setEdit({ status: p.status === 'pending' ? 'processing' : p.status, failure_code: p.failure_code || '', note: '' }); };
  const setF = (key) => (e) => setForm({ ...form, [key]: e.target.value });
  const csvColumns = [
    { label: 'ID', value: (p) => p.id }, { label: 'Farmer ID', value: (p) => p.farmer_id }, { label: 'Name', value: (p) => p.farmer_name }, { label: 'Crop', value: (p) => p.crop },
    { label: 'Quantity (q)', value: (p) => p.quantity_qtl }, { label: 'Amount', value: (p) => p.amount }, { label: 'Sold on', value: (p) => p.sold_on },
    { label: 'Days waiting', value: (p) => p.days_waiting }, { label: 'Status', value: (p) => p.status }, { label: 'Reason', value: (p) => (p.failure_code ? codes[p.failure_code] || p.failure_code : '') },
    { label: 'Complaint', value: (p) => p.grievance_id },
  ];

  return (
    <div>
      <div className="kpi-row" style={{ marginBottom: 18 }}>
        <StatCard icon={Icons.checkCircle} value={money(sum((p) => p.status === 'paid'))} label={t('amountPaid')} sub={`${rows.filter((p) => p.status === 'paid').length} ${t('paidCount')}`} />
        <StatCard icon={Icons.clock} tone="purple" value={money(sum((p) => ['pending', 'processing'].includes(p.status)))} label={t('amountAwaiting')} sub={`${rows.filter((p) => ['pending', 'processing'].includes(p.status)).length} ${t('paymentsOpen').toLowerCase()}`} />
        <StatCard icon={Icons.alert} tone="warn" value={rows.filter((p) => p.status === 'failed').length} label={t('paymentsFailed')} sub={money(sum((p) => p.status === 'failed'))} />
        <StatCard icon={Icons.clock} tone="warn" value={rows.filter(overdue).length} label={t('attOverdue')} sub={t('overdueRule')} />
      </div>
      <div className="toolbar">
        <SearchBox value={search} onChange={setSearch} placeholder={t('searchPayments')} />
        <button onClick={() => { setCreating(true); setForm(blank); }}>{t('recordPayment')}</button>
        <div style={{ marginLeft: 'auto', display: 'flex', gap: 10, alignItems: 'center' }}>
          <ExportButton filename="payments.csv" columns={csvColumns} rows={shown} t={t} />
          {!list.error && <LiveBadge lastRefreshed={list.lastRefreshed} t={t} />}
        </div>
      </div>
      <Chips value={filter} onChange={setFilter} options={[
        { id: 'all', label: t('chipAll'), count: base.length }, { id: 'open', label: t('chipOpen'), count: n((p) => ['pending', 'processing'].includes(p.status)) },
        { id: 'paid', label: t('pay_paid'), count: n((p) => p.status === 'paid') }, { id: 'failed', label: t('pay_failed'), count: n((p) => p.status === 'failed') },
        { id: 'overdue', label: t('attOverdue'), count: n(overdue) },
      ]} />
      <ErrorNotice code={list.error} t={t} />
      <div className="table-scroll">
        <table>
          <thead><tr><th>{t('colFarmer')}</th><th>{t('colCrop')}</th><th>{t('colAmount')}</th><th>{t('colSoldOn')}</th><th>{t('colDays')}</th><th>{t('colStatus')}</th><th>{t('colReason')}</th><th>{t('colComplaint')}</th><th></th></tr></thead>
          <tbody>
            {!list.loaded && !list.error && <SkeletonRows cols={9} />}
            {list.loaded && shown.length === 0 && !list.error && <tr><td colSpan="9"><EmptyBlock icon={Icons.rupee} title={t('noPayments')} hint={t('noPaymentsHint')} /></td></tr>}
            {shown.map((p) => (
              <tr key={p.id}>
                <td><Person name={p.farmer_name} id={p.farmer_id} /></td>
                <td>{p.crop || '—'}{p.quantity_qtl != null ? ` · ${p.quantity_qtl} q` : ''}</td>
                <td style={{ fontWeight: 700 }}>{money(p.amount)}</td>
                <td style={{ whiteSpace: 'nowrap' }}>{fmtDay(p.sold_on)}</td>
                <td>{p.status === 'paid' ? '—' : <span className={overdue(p) ? 'overdue-days' : ''}>{p.days_waiting}</span>}</td>
                <td><span className={`badge ${PAY_BADGE[p.status]}`}>{t(`pay_${p.status}`)}</span></td>
                <td>{p.failure_code ? (codes[p.failure_code] || prettyCode(p.failure_code)) : '—'}</td>
                <td>{p.grievance_id ? `#${p.grievance_id}` : '—'}</td>
                <td style={{ whiteSpace: 'nowrap' }}>
                  {p.status !== 'paid' && <button className="btn-sm" onClick={() => patch(p, { status: 'paid' }, t('toastMarkedPaid'))}>{t('markPaid')}</button>}{' '}
                  <button className="secondary btn-sm" onClick={() => openEdit(p)}>{t('update')}</button>{' '}
                  <button className="secondary btn-sm" onClick={() => setViewing(p)}>{t('timeline')}</button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {viewing && (
        <Modal wide title={t('paymentTimeline')} onClose={() => setViewing(null)} actions={<button className="secondary" onClick={() => setViewing(null)}>{t('close')}</button>}>
          <div className="farmer-head"><Person name={viewing.farmer_name} id={viewing.farmer_id} /><div style={{ marginLeft: 'auto', textAlign: 'right' }}><div className="big-money">{money(viewing.amount)}</div><span className={`badge ${PAY_BADGE[viewing.status]}`}>{t(`pay_${viewing.status}`)}</span></div></div>
          <div className="pills" style={{ marginTop: 10 }}>
            {viewing.crop && <span className="pill">{viewing.crop}{viewing.quantity_qtl != null ? ` · ${viewing.quantity_qtl} q` : ''}</span>}
            {viewing.mandi_name && <span className="pill">📍 {viewing.mandi_name}</span>}
            <span className="pill">{t('colSoldOn')}: {fmtDay(viewing.sold_on)}</span>
            {viewing.status !== 'paid' && <span className="pill">{viewing.days_waiting} {t('daysWaiting')}</span>}
          </div>
          {viewing.failure_code && <div className="reason-box"><strong>{t('colReason')}:</strong> {codes[viewing.failure_code] || prettyCode(viewing.failure_code)}</div>}
          {viewing.grievance_id && <div className="reason-box amber"><strong>{t('complaint')} #{viewing.grievance_id}</strong></div>}
          <div className="timeline" style={{ marginTop: 14 }}>
            {[...viewing.timeline].reverse().map((e, i) => (
              <div className="tl-item" key={i}>
                <div className={`tl-dot ${e.status === 'paid' ? 'green' : e.status === 'failed' ? 'red' : 'amber'}`}></div>
                <div className="tl-body"><div className="tl-top"><strong>{t(`pay_${e.status}`)}</strong>{e.failure_code ? ` — ${codes[e.failure_code] || prettyCode(e.failure_code)}` : ''}</div>{e.note && <div className="tl-detail">{e.note}</div>}</div>
                <div className="tl-time">{fmtDateTime(e.ts)}</div>
              </div>
            ))}
          </div>
        </Modal>
      )}

      {creating && (
        <Modal title={t('recordPayment')} onClose={() => setCreating(false)} actions={<>
          <button className="secondary" onClick={() => setCreating(false)}>{t('cancel')}</button>
          <button onClick={create} disabled={!form.farmer_id.trim()}>{t('save')}</button></>}>
          <div className="field"><label>{t('farmerLabel')}</label>
            <input list="farmer-options" value={form.farmer_id} onChange={setF('farmer_id')} placeholder={t('farmerPick')} />
            <datalist id="farmer-options">{farmers.map((f) => <option key={f.farmer_id} value={f.farmer_id}>{f.name || ''}</option>)}</datalist></div>
          <div className="field"><label>{t('colCrop')}</label><input list="crop-options" value={form.crop} onChange={setF('crop')} />
            <datalist id="crop-options">{CROPS.map((c) => <option key={c} value={c} />)}</datalist></div>
          <div className="field"><label>{t('qtyLabel')}</label><input type="number" min="0" value={form.quantity_qtl} onChange={setF('quantity_qtl')} /></div>
          <div className="field"><label>{t('amountLabel')}</label><input type="number" min="0" value={form.amount} onChange={setF('amount')} /></div>
          <div className="field"><label>{t('colSoldOn')}</label><input type="date" value={form.sold_on} onChange={setF('sold_on')} /></div>
          <div className="field"><label>{t('paymentNote')}</label><input value={form.note} onChange={setF('note')} /></div>
        </Modal>
      )}

      {editing && (
        <Modal title={t('updatePayment')} onClose={() => setEditing(null)} actions={<>
          <button className="secondary" onClick={() => setEditing(null)}>{t('cancel')}</button>
          <button onClick={() => patch(editing, { status: edit.status, failure_code: edit.status === 'failed' && edit.failure_code ? edit.failure_code : null, note: edit.note || null }, t('toastPaymentUpdated'))}>{t('save')}</button></>}>
          <Person name={editing.farmer_name} id={editing.farmer_id} sub={`${money(editing.amount)} · ${editing.crop || ''}`} />
          <div className="field" style={{ marginTop: 14 }}><label>{t('statusLabel')}</label>
            <select value={edit.status} onChange={(e) => setEdit({ ...edit, status: e.target.value })} style={{ width: '100%' }}>
              {['pending', 'processing', 'paid', 'failed'].map((v) => <option key={v} value={v}>{t(`pay_${v}`)}</option>)}</select></div>
          {edit.status === 'failed' && (
            <div className="field"><label>{t('failureReason')}</label>
              <select value={edit.failure_code} onChange={(e) => setEdit({ ...edit, failure_code: e.target.value })} style={{ width: '100%' }}>
                <option value="">{t('reasonUnknown')}</option>{codeList.map((c) => <option key={c.code} value={c.code}>{c.meaning}</option>)}</select></div>
          )}
          <div className="field"><label>{t('paymentNote')}</label><input value={edit.note} onChange={(e) => setEdit({ ...edit, note: e.target.value })} /></div>
          <div className="hint-text">{t('paymentNotifyNote')}</div>
        </Modal>
      )}
    </div>
  );
}

// ================= queue load =================
function LoadTab({ apiFetch, t }) {
  const toast = useToast();
  const [date, setDate] = useState(todayIso());
  const [drafts, setDrafts] = useState({});
  const queue = useList(apiFetch, `/admin/queue?date=${date}`, 15000);
  const mandis = useList(apiFetch, '/admin/mandis', 30000);
  const rows = queue.data || [];
  const error = queue.error || mandis.error;
  const total = (key) => rows.reduce((acc, r) => acc + r[key], 0);
  const busiest = rows.slice().sort((a, b) => b.active / b.capacity - a.active / a.capacity)[0];

  const saveCapacity = async (m) => {
    try {
      await apiFetch(`/admin/mandis/${m.id}`, { method: 'PATCH', body: JSON.stringify({ capacity_per_window: Number(drafts[m.id]) }) });
      toast(t('toastCapacity')); setDrafts((d) => { const next = { ...d }; delete next[m.id]; return next; }); mandis.reload(); queue.reload();
    } catch (e) { toast(t('capacityInvalid'), 'error'); }
  };

  return (
    <div>
      <div className="toolbar">
        <div className="stepper">
          <button className="secondary btn-sm" onClick={() => setDate(shiftDay(date, -1))} aria-label="previous day">‹</button>
          <input type="date" value={date} onChange={(e) => e.target.value && setDate(e.target.value)} />
          <button className="secondary btn-sm" onClick={() => setDate(shiftDay(date, 1))} aria-label="next day">›</button>
          <button className="secondary btn-sm" onClick={() => setDate(todayIso())}>{t('today')}</button>
        </div>
        <div style={{ marginLeft: 'auto' }}>{!error && <LiveBadge lastRefreshed={queue.lastRefreshed} t={t} />}</div>
      </div>
      <ErrorNotice code={error} t={t} />
      <div className="kpi-row" style={{ marginBottom: 18 }}>
        <StatCard icon={Icons.calendar} tone="info" value={total('active')} label={t('chipInQueue')} />
        <StatCard icon={Icons.users} value={total('arrived')} label={t('colArrived')} />
        <StatCard icon={Icons.checkCircle} value={total('completed')} label={t('colDone')} />
        <StatCard icon={Icons.pin} tone="warn" value={busiest ? `${Math.round((busiest.active / busiest.capacity) * 100)}%` : '—'} label={t('busiestWindow')} sub={busiest ? `${busiest.mandi_name} · ${busiest.window}` : t('noLoad')} />
      </div>
      {mandis.loaded && (mandis.data.length === 0
        ? <div className="panel"><EmptyBlock icon={Icons.pin} title={t('noMandis')} hint={t('noMandisHint')} /></div>
        : <div className="mandi-grid">
          {mandis.data.map((m) => {
            const windows = rows.filter((r) => r.mandi_id === m.id);
            const draft = drafts[m.id];
            const changed = draft !== undefined && Number(draft) !== m.capacity_per_window;
            return (
              <div className="mandi-card" key={m.id}>
                <div className="mandi-head"><Icon path={Icons.pin} /> <strong>{m.name}</strong></div>
                <div className="capacity-row">
                  <label>{t('capacityLabel')}</label>
                  <input type="number" min="1" max="500" value={draft !== undefined ? draft : m.capacity_per_window} onChange={(e) => setDrafts({ ...drafts, [m.id]: e.target.value })} />
                  {changed && <button className="btn-sm" onClick={() => saveCapacity(m)}>{t('save')}</button>}
                </div>
                {windows.length === 0 && <div className="window-sub" style={{ padding: '10px 0' }}>{t('noLoad')}</div>}
                {windows.map((r) => {
                  const pct = Math.min(100, Math.round((r.active / r.capacity) * 100));
                  return (
                    <div className="window-row" key={r.window}>
                      <div className="window-top"><span>{r.window}</span><span><strong>{r.active}</strong>/{r.capacity}</span></div>
                      <div className="bar-track"><div className="bar-fill" style={{ width: `${pct}%`, background: pct >= 90 ? '#B91C1C' : pct >= 70 ? '#B45309' : '#15803D' }} /></div>
                      <div className="window-sub">{r.arrived} {t('colArrived').toLowerCase()} · {r.completed} {t('colDone').toLowerCase()} · {r.avg_service_minutes} {t('minutes')} <span className={`badge ${r.service_measured ? 'resolved' : 'in_progress'}`}>{r.service_measured ? t('measured') : t('assumed')}</span></div>
                    </div>
                  );
                })}
              </div>
            );
          })}
        </div>)}
      <div className="hint-text" style={{ marginTop: 14 }}>{t('loadNote')}</div>
    </div>
  );
}

// ================= messages =================
const kindGroup = (kind) => (kind === 'announcement' ? 'announcements' : kind.startsWith('slot_') ? 'slots' : kind === 'payment_update' ? 'payments' : kind.startsWith('complaint_') ? 'complaints' : 'other');

function AnnounceModal({ apiFetch, t, presetFarmer, onClose, onSent }) {
  const toast = useToast();
  const { farmers } = useData();
  const [mode, setMode] = useState(presetFarmer ? 'one' : 'all');
  const [farmer, setFarmer] = useState(presetFarmer || '');
  const [title, setTitle] = useState('');
  const [body, setBody] = useState('');
  const [sending, setSending] = useState(false);
  const known = farmers.some((f) => f.farmer_id === farmer);
  const valid = title.trim() && title.trim().length <= 80 && body.trim() && body.trim().length <= 500 && (mode === 'all' || known);
  const send = async () => {
    setSending(true);
    try {
      const result = await apiFetch('/admin/announce', { method: 'POST', body: JSON.stringify({ title, body, farmer_id: mode === 'one' ? farmer : null }) });
      toast(t('sentTo').replace('{n}', result.sent)); onSent(); onClose();
    } catch (e) { toast(t('actionFailed'), 'error'); } finally { setSending(false); }
  };
  return (
    <Modal wide title={t('newMessage')} onClose={onClose} actions={<><button className="secondary" onClick={onClose}>{t('cancel')}</button><button onClick={send} disabled={!valid || sending}>{t('sendNow')}</button></>}>
      <div className="field"><label>{t('recipient')}</label>
        <div className="radio-row">
          <label><input type="radio" checked={mode === 'all'} onChange={() => setMode('all')} /> {t('allFarmers')} ({farmers.length})</label>
          <label><input type="radio" checked={mode === 'one'} onChange={() => setMode('one')} /> {t('oneFarmer')}</label>
        </div>
        {mode === 'one' && <><input list="announce-farmers" value={farmer} onChange={(e) => setFarmer(e.target.value)} placeholder={t('farmerPick')} style={{ marginTop: 8 }} />
          <datalist id="announce-farmers">{farmers.map((f) => <option key={f.farmer_id} value={f.farmer_id}>{f.name || ''}</option>)}</datalist>
          {farmer && !known && <div className="error-text" style={{ marginTop: 6 }}>{t('unknownFarmer')}</div>}</>}
      </div>
      <div className="field"><label>{t('msgTitle')} <span className="counter">{title.length}/80</span></label><input value={title} maxLength={80} onChange={(e) => setTitle(e.target.value)} placeholder={t('msgTitleHint')} /></div>
      <div className="field"><label>{t('msgBody')} <span className="counter">{body.length}/500</span></label><textarea value={body} maxLength={500} onChange={(e) => setBody(e.target.value)} placeholder={t('msgBodyHint')} /></div>
      <div className="msg-preview"><div className="pv-label">{t('preview')}</div><div className="pv-title">{title || t('msgTitle')}</div><div className="pv-body">{body || t('msgBody')}</div></div>
      <div className="hint-text">{t('announceNote')}</div>
    </Modal>
  );
}

function MessagesTab({ apiFetch, t, onCompose }) {
  const [filter, setFilter] = useState('all');
  const [search, setSearch] = useState('');
  const list = useList(apiFetch, '/admin/notifications?limit=200', 20000);
  const rows = list.data || [];
  const base = rows.filter((r) => matches(search, r.farmer_id, r.farmer_name, r.title, r.body));
  const n = (g) => base.filter((r) => kindGroup(r.kind) === g).length;
  const shown = base.filter((r) => filter === 'all' || kindGroup(r.kind) === filter);
  const smsLabel = (s) => ({ sent: t('smsSent'), logged: t('smsLogged'), failed: t('smsFailed'), pending: t('smsPending'), no_phone: t('smsNoPhone') }[s] || '—');
  const csvColumns = [
    { label: 'When', value: (r) => r.created_at }, { label: 'Farmer ID', value: (r) => r.farmer_id }, { label: 'Name', value: (r) => r.farmer_name },
    { label: 'Type', value: (r) => r.kind }, { label: 'Title', value: (r) => r.title }, { label: 'Message', value: (r) => r.body },
    { label: 'Seen', value: (r) => (r.read_at ? 'yes' : 'no') }, { label: 'SMS', value: (r) => r.sms_status },
  ];
  return (
    <div>
      <div className="info-banner">{t('messagesNote')}</div>
      <div className="toolbar">
        <SearchBox value={search} onChange={setSearch} placeholder={t('searchMessages')} />
        <button onClick={onCompose}><Icon path={Icons.send} /> {t('newMessage')}</button>
        <div style={{ marginLeft: 'auto', display: 'flex', gap: 10, alignItems: 'center' }}>
          <ExportButton filename="messages.csv" columns={csvColumns} rows={shown} t={t} />
          {!list.error && <LiveBadge lastRefreshed={list.lastRefreshed} t={t} />}
        </div>
      </div>
      <Chips value={filter} onChange={setFilter} options={[
        { id: 'all', label: t('chipAll'), count: base.length }, { id: 'slots', label: t('kindSlots'), count: n('slots') }, { id: 'payments', label: t('kindPayments'), count: n('payments') },
        { id: 'complaints', label: t('kindComplaints'), count: n('complaints') }, { id: 'announcements', label: t('kindAnnouncements'), count: n('announcements') },
      ]} />
      <ErrorNotice code={list.error} t={t} />
      <div className="table-scroll">
        <table>
          <thead><tr><th>{t('colWhen')}</th><th>{t('colFarmer')}</th><th>{t('colMessage')}</th><th>{t('colSeen')}</th><th>{t('colSms')}</th></tr></thead>
          <tbody>
            {!list.loaded && !list.error && <SkeletonRows cols={5} />}
            {list.loaded && shown.length === 0 && !list.error && <tr><td colSpan="5"><EmptyBlock icon={Icons.chat} title={t('noMessages')} hint={t('noMessagesHint')} /></td></tr>}
            {shown.map((r) => (
              <tr key={r.id}>
                <td style={{ whiteSpace: 'nowrap' }}>{fmtDateTime(r.created_at)}</td>
                <td><Person name={r.farmer_name} id={r.farmer_id} /></td>
                <td style={{ maxWidth: 440 }}><div style={{ fontWeight: 700 }}>{r.title}</div><div style={{ color: 'var(--text-muted)' }}>{r.body}</div></td>
                <td>{r.read_at ? <span className="seen"><Icon path={Icons.check} /> {t('seen')}</span> : <span className="unread">{t('unread')}</span>}</td>
                <td><span className={`badge ${SMS_BADGE[r.sms_status] || ''}`} title={r.sms_detail || ''}>{smsLabel(r.sms_status)}</span></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ================= shell =================
Object.assign(Icons, {
  send: '<path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" />',
  refresh: '<path d="M23 4v6h-6M1 20v-6h6" /><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15" />',
  check: '<path d="M20 6L9 17l-5-5" />',
  checkCircle: '<path d="M22 11.08V12a10 10 0 11-5.93-9.14" /><path d="M22 4L12 14.01l-3-3" />',
  clock: '<circle cx="12" cy="12" r="10" /><path d="M12 6v6l4 2" />',
});

const TAB_ORDER = [
  { id: 'overview', icon: Icons.grid },
  { id: 'farmers', icon: Icons.users },
  { id: 'grievances', icon: Icons.alert },
  { id: 'slots', icon: Icons.calendar },
  { id: 'payments', icon: Icons.rupee },
  { id: 'load', icon: Icons.pin },
  { id: 'messages', icon: Icons.chat },
];

function Dashboard({ apiUrl, token, onLogout }) {
  const [nav, setNav] = useState({ tab: 'overview', filter: null, n: 0 });
  const [lang, setLang] = useState('en');
  const [composing, setComposing] = useState(null);
  const t = useT(lang);
  LOCALE = lang === 'hi' ? 'hi-IN' : 'en-IN';
  const apiFetch = useAdminFetch(apiUrl, token);
  const go = useCallback((tab, filter = null) => setNav((x) => ({ tab, filter, n: x.n + 1 })), []);

  const overview = useList(apiFetch, '/admin/overview', 20000);
  const codeData = useList(apiFetch, '/admin/failure-codes', 600000);
  const farmerData = useList(apiFetch, '/admin/farmers', 30000);
  const ctx = React.useMemo(() => {
    const list = codeData.data || [];
    return { codes: Object.fromEntries(list.map((c) => [c.code, c.meaning])), codeList: list, farmers: farmerData.data || [] };
  }, [codeData.data, farmerData.data]);

  const p = (overview.data && overview.data.procurement) || {};
  const badges = {
    grievances: overview.data ? overview.data.open_grievances : 0,
    payments: (p.payments_failed || 0),
    slots: (p.queue_active || 0),
  };
  const navLabel = { overview: t('navOverview'), farmers: t('navFarmers'), grievances: t('navGrievances'), slots: t('navSlots'), payments: t('navPayments'), load: t('navLoad'), messages: t('navMessages') };
  const subLabel = { overview: t('subOverview'), farmers: t('subFarmers'), grievances: t('subGrievances'), slots: t('subSlots'), payments: t('subPayments'), load: t('subLoad'), messages: t('subMessages') };
  const link = overview.error ? 'bad' : overview.loaded ? 'ok' : 'wait';
  const host = apiUrl.replace(/^https?:\/\//, '');
  const tabProps = { key: nav.n, apiFetch, t, initialFilter: nav.filter };

  return (
    <DataContext.Provider value={ctx}>
      <div className="app">
        <div className="sidebar">
          <div className="brand">
            <div className="brand-icon" style={{ fontSize: 22 }}>🌾</div>
            <div className="brand-text"><h1>{t('appName')}</h1><div className="sub">{t('appSubtitle')}</div></div>
          </div>
          <div className="nav-section-label">{t('navLive')}</div>
          {TAB_ORDER.map((x) => (
            <div key={x.id} className={`nav-item ${nav.tab === x.id ? 'active' : ''}`} onClick={() => go(x.id)}>
              <Icon path={x.icon} />{navLabel[x.id]}
              {badges[x.id] > 0 && <span className={`nav-badge ${x.id === 'payments' ? 'red' : x.id === 'grievances' ? 'amber' : 'blue'}`}>{badges[x.id]}</span>}
            </div>
          ))}
          <div className="sidebar-footer">
            <div className="conn"><span className={`conn-dot ${link}`}></span>{link === 'ok' ? `${t('connected')} · ${host}` : link === 'wait' ? t('connecting') : t('disconnected')}</div>
            <LangToggle lang={lang} setLang={setLang} />
            <button className="secondary" style={{ width: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8 }} onClick={onLogout}>
              <Icon path={Icons.signout} /> {t('signOut')}
            </button>
          </div>
        </div>
        <div className="main">
          <div className="topbar">
            <div><h2>{navLabel[nav.tab]}</h2><div className="subtitle">{subLabel[nav.tab]}</div></div>
            <div className="topbar-right">
              <span className="date-pill">{new Date().toLocaleDateString(LOCALE, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}</span>
              <button className="secondary btn-sm" onClick={() => window.dispatchEvent(new Event('dash-refresh'))}><Icon path={Icons.refresh} /> {t('refresh')}</button>
            </div>
          </div>
          <div className="content">
            {nav.tab === 'overview' && <OverviewTab {...tabProps} lang={lang} go={go} />}
            {nav.tab === 'farmers' && <FarmersTab {...tabProps} onMessage={(id) => setComposing({ farmer: id })} />}
            {nav.tab === 'grievances' && <GrievancesTab {...tabProps} />}
            {nav.tab === 'slots' && <SlotsTab {...tabProps} />}
            {nav.tab === 'payments' && <PaymentsTab {...tabProps} />}
            {nav.tab === 'load' && <LoadTab {...tabProps} />}
            {nav.tab === 'messages' && <MessagesTab {...tabProps} onCompose={() => setComposing({ farmer: '' })} />}
          </div>
        </div>
        {composing && <AnnounceModal apiFetch={apiFetch} t={t} presetFarmer={composing.farmer} onClose={() => setComposing(null)} onSent={() => window.dispatchEvent(new Event('dash-refresh'))} />}
      </div>
    </DataContext.Provider>
  );
}

function App() {
  const [session, setSession] = useState(null);
  const [lang, setLang] = useState('en');
  const t = useT(lang);
  return (
    <ToastProvider>
      {!session
        ? <LoginScreen onLogin={(apiUrl, token) => setSession({ apiUrl, token })} lang={lang} setLang={setLang} t={t} />
        : <Dashboard apiUrl={session.apiUrl} token={session.token} onLogout={() => setSession(null)} />}
    </ToastProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
